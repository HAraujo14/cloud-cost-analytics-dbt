repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        args: ["--dialect", "duckdb"]
        additional_dependencies:
          - sqlfluff-templater-dbt==4.4.0
          - dbt-core==1.12.6
          - dbt-duckdb==1.11.0
          - duckdb==2.0.0
        files: \.(sql)$
